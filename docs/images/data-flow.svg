<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="994" viewBox="0 0 1200 994" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7587"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A6700"/></marker>
    <style>.t{font-size:15px;font-weight:700;fill:#1B1F27}.s{font-size:12.5px;fill:#5F6878}.w{font-size:12.5px;fill:#1B1F27}.h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}</style>
  </defs>
  <rect width="1200" height="994" fill="#FFFFFF"/>
  <rect x="20" y="20" width="410" height="824" rx="14" fill="#F7F9FC" stroke="#1B1F27" stroke-width="1.4"/>
  <text x="40" y="50" class="h">ON THE TESTER'S COMPUTER</text>
  <text x="40" y="72" class="s">What starts the flow</text>
  <text x="550" y="50" class="h">SENT TO</text>
  <text x="810" y="50" class="h">WHAT IS SENT</text>
  <line x1="450" y1="30" x2="450" y2="844" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="458" y="72" font-size="12" font-weight="700" fill="#B3261E">leaves the computer</text>
  
  <rect x="40" y="96" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="133" r="14" fill="#1A57CC"/><text x="68" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="94" y="128" class="t">Conversation</text><text x="94" y="149" class="s">Codex engine</text>
  <path d="M340 133 H546" stroke="#1A57CC" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <rect x="550" y="96" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4"/>
  <text x="566" y="128" class="t">OpenAI</text><text x="566" y="149" class="s">ChatGPT sign-in</text>
  <text x="810" y="116" class="w">Messages; business profile; policy list; memory.</text><text x="810" y="135" class="w">Tool results: register lines, text of files the</text><text x="810" y="154" class="w">model reads (a resume in full), attached images.</text>
  <rect x="40" y="188" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="225" r="14" fill="#1A57CC"/><text x="68" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="94" y="220" class="t">Screening</text><text x="94" y="241" class="s">background model calls</text>
  <path d="M340 225 H546" stroke="#1A57CC" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <rect x="550" y="188" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4"/>
  <text x="566" y="220" class="t">OpenAI</text><text x="566" y="241" class="s">a background call</text>
  <text x="810" y="208" class="w">The job description; each resume with name, email,</text><text x="810" y="227" class="w">phone, links and birth-date lines masked (best</text><text x="810" y="246" class="w">effort). No file names.</text>
  <rect x="40" y="280" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="317" r="14" fill="#1A57CC"/><text x="68" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="94" y="312" class="t">Legal research</text><text x="94" y="333" class="s">an isolated model call</text>
  <path d="M340 317 H546" stroke="#1A57CC" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <rect x="550" y="280" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4"/>
  <text x="566" y="312" class="t">OpenAI, then official</text><text x="566" y="333" class="s">sites (web search)</text>
  <text x="810" y="300" class="w">The question only: at most 500 characters, refused</text><text x="810" y="319" class="w">if it holds personal data. Sources outside the 23</text><text x="810" y="338" class="w">official domains are dropped.</text>
  <rect x="40" y="372" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="409" r="14" fill="#1A57CC"/><text x="68" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <text x="94" y="404" class="t">Conversation notes</text><text x="94" y="425" class="s">at the end of a conversation</text>
  <path d="M340 409 H546" stroke="#1A57CC" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <rect x="550" y="372" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4"/>
  <text x="566" y="404" class="t">OpenAI</text><text x="566" y="425" class="s">a background call</text>
  <text x="810" y="392" class="w">The last 40 messages (1,500 characters each), told</text><text x="810" y="411" class="w">to keep no names. A note with personal data is</text><text x="810" y="430" class="w">dropped.</text>
  <rect x="40" y="464" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="501" r="14" fill="#1A57CC"/><text x="68" y="506" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
  <text x="94" y="496" class="t">Voice</text><text x="94" y="517" class="s">voice bridge</text>
  <path d="M340 501 H546" stroke="#1A57CC" stroke-width="2" fill="none" marker-end="url(#mo)"/>
  <rect x="550" y="464" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4"/>
  <text x="566" y="496" class="t">OpenAI Live API</text><text x="566" y="517" class="s">the tester's own API key</text>
  <text x="810" y="484" class="w">Microphone audio while voice is on; the reply text</text><text x="810" y="503" class="w">read aloud; tool activity lines (these can name an</text><text x="810" y="522" class="w">employee or a file). No audio is saved.</text>
  <rect x="40" y="556" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="593" r="14" fill="#6B7587"/><text x="68" y="598" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
  <text x="94" y="588" class="t">Update check</text><text x="94" y="609" class="s">desktop app, every 6 hours</text>
  <path d="M340 593 H546" stroke="#6B7587" stroke-width="2" fill="none" marker-end="url(#mg)"/>
  <rect x="550" y="556" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#6B7587" stroke-width="1.4"/>
  <text x="566" y="588" class="t">GitHub</text><text x="566" y="609" class="s">public releases</text>
  <text x="810" y="576" class="w">Release list and latest.yml, a random updater ID.</text><text x="810" y="595" class="w">The download is checked against its sha512.</text><text x="810" y="614" class="w">The installer is not code-signed.</text>
  <rect x="40" y="648" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="685" r="14" fill="#9A6700"/><text x="68" y="690" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">7</text>
  <text x="94" y="680" class="t">Send feedback</text><text x="94" y="701" class="s">the tester's own email app</text>
  <path d="M340 685 H546" stroke="#9A6700" stroke-width="2" fill="none" marker-end="url(#ma)"/>
  <rect x="550" y="648" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#9A6700" stroke-width="1.4"/>
  <text x="566" y="680" class="t">Coordinator's</text><text x="566" y="701" class="s">mailbox</text>
  <text x="810" y="668" class="w">The feedback file: ratings with question and</text><text x="810" y="687" class="w">answer text, the current conversation, technical</text><text x="810" y="706" class="w">details (all ticked by default). The tester sends it.</text>
  <rect x="40" y="740" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#B8C2D3"/>
  <circle cx="68" cy="777" r="14" fill="#6B7587"/><text x="68" y="782" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">8</text>
  <text x="94" y="772" class="t">The window</text><text x="94" y="793" class="s">page fonts</text>
  <path d="M340 777 H546" stroke="#6B7587" stroke-width="2" fill="none" marker-end="url(#mg)"/>
  <rect x="550" y="740" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#6B7587" stroke-width="1.4"/>
  <text x="566" y="772" class="t">Google Fonts</text><text x="566" y="793" class="s"></text>
  <text x="810" y="760" class="w">Ordinary web requests (IP address, browser details).</text><text x="810" y="779" class="w">No MeritAI data.</text>
  <rect x="20" y="860" width="1160" height="118" rx="14" fill="#F4F8F1" stroke="#6E9A63" stroke-width="1.2"/>
  <text x="40" y="888" class="t">Stays on this computer (unless a row above sends it)</text>
  <text x="40" y="912" class="w">The employee register and the screening catalog (full resume text) in the workspace's .assistant folder; the business profile file; Inbox, Outbox,</text>
  <text x="40" y="932" class="w">Jobs and Policies files; email drafts until the owner sends them; the voice API key (encrypted for the Windows user); memory files; Codex's conversation</text>
  <text x="40" y="952" class="w">files and logs. At start-up the app deletes conversations with no activity for 30 days; other files stay until deleted. Only the voice key is encrypted.</text>
</svg>
