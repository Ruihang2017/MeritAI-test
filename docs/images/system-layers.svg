<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="1036" fill="#FFFFFF"/>
<rect x="20" y="20" width="1160" height="132" rx="12" class="band"/><text x="36" y="44" class="h">FRONT ENDS: RENDER, ASK YES OR NO, READ INPUT. NO BEHAVIOUR OF THEIR OWN</text>
<rect x="36" y="54" width="360" height="86" rx="10" class="box"/><text x="52" y="80" class="t">Desktop shell</text><text x="52" y="102" class="s">src/desktop: the Electron window, the app's</text><text x="52" y="120" class="s">folders, self-update from GitHub releases.</text>
<rect x="420" y="54" width="360" height="86" rx="10" class="box"/><text x="436" y="80" class="t">Browser UI</text><text x="436" y="102" class="s">web/ (React + Vite): a component per page, the side</text><text x="436" y="120" class="s">panel, what changed, Chinese.</text>
<rect x="804" y="54" width="360" height="86" rx="10" class="box"/><text x="820" y="80" class="t">Terminal</text><text x="820" y="102" class="s">src/cli.ts: commands, rendering, [y/n]. Calls</text><text x="820" y="120" class="s">AssistantApp directly.</text>
<rect x="20" y="172" width="1160" height="122" rx="12" class="band"/><text x="36" y="196" class="h">TRANSPORT: ONE LOCAL WEBSOCKET (BROWSER UI AND DESKTOP)</text>
<rect x="36" y="206" width="360" height="76" rx="10" class="box"/><text x="52" y="232" class="t">server.ts</text><text x="52" y="254" class="s">127.0.0.1, token, Origin and Host checks, the built</text><text x="52" y="272" class="s">page.</text>
<rect x="420" y="206" width="360" height="76" rx="10" class="box"/><text x="436" y="232" class="t">session.ts</text><text x="436" y="254" class="s">83-method allowlist, inputs checked, one long</text><text x="436" y="272" class="s">action at a time, events to every tab.</text>
<rect x="804" y="206" width="360" height="76" rx="10" class="box"/><text x="820" y="232" class="t">protocol.ts</text><text x="820" y="254" class="s">The request, result and event types, shared with</text><text x="820" y="272" class="s">web/.</text>
<rect x="20" y="314" width="1160" height="132" rx="12" class="band"/><text x="36" y="338" class="h">APPLICATION: EVERYTHING A FRONT END NEEDS, WITH NO UI IN IT</text>
<rect x="36" y="348" width="744" height="86" rx="10" class="core"/><text x="52" y="374" class="t">AssistantApp (src/app/app.ts)</text><text x="52" y="396" class="s">Conversations and history, forms for the register and profile, attachments, jobs and screening, the job</text><text x="52" y="414" class="s">description, sending email, voice, feedback, checks on each reply.</text>
<rect x="804" y="348" width="360" height="86" rx="10" class="box"/><text x="820" y="374" class="t">Helpers (src/app)</text><text x="820" y="396" class="s">confirms.ts (questions that can be withdrawn),</text><text x="820" y="414" class="s">uploads.ts, launch.ts, feedback.ts.</text>
<rect x="20" y="466" width="1160" height="96" rx="12" class="band"/><text x="36" y="490" class="h">WIRING</text>
<rect x="36" y="494" width="1128" height="58" rx="10" class="core"/><text x="52" y="520" class="t">createAssistant() (src/assistant.ts)</text><text x="52" y="542" class="s">The one place the engine, prompts, business profile, policies, memory and the 34 tools are put together. The app, every test suite and the evaluation use it.</text>
<rect x="20" y="582" width="1160" height="282" rx="12" class="band"/><text x="36" y="606" class="h">CORE: THE RULES AND THE DATA. EACH MODULE OWNS ITS STORE AND ITS TOOLS</text>
<rect x="36" y="614" width="272" height="114" rx="10" class="box"/><text x="52" y="640" class="t">business</text><text x="52" y="662" class="s">Profile, employee register,</text><text x="52" y="680" class="s">reminders, checklists (new starter,</text><text x="52" y="698" class="s">leaving, parental leave), hiring, job</text><text x="52" y="716" class="s">templates, pay and weekday checks.</text>
<rect x="320" y="614" width="272" height="114" rx="10" class="box"/><text x="336" y="640" class="t">screening</text><text x="336" y="662" class="s">Catalog (SQLite), the pipeline:</text><text x="336" y="680" class="s">ingest, criteria, blind evaluation,</text><text x="336" y="698" class="s">ranking; reports; the Hiring page's</text><text x="336" y="716" class="s">actions as tools.</text>
<rect x="604" y="614" width="272" height="114" rx="10" class="box"/><text x="620" y="640" class="t">files</text><text x="620" y="662" class="s">Folders and path guards, PDF and Word</text><text x="620" y="680" class="s">parsing, Word output, email drafts</text><text x="620" y="698" class="s">(.eml), drag and drop.</text>
<rect x="888" y="614" width="272" height="114" rx="10" class="box"/><text x="904" y="640" class="t">email</text><text x="904" y="662" class="s">Google sign-in for gmail.send,</text><text x="904" y="680" class="s">sending, the drafts to review, the</text><text x="904" y="698" class="s">10-second queue.</text>
<rect x="36" y="738" width="272" height="114" rx="10" class="box"/><text x="52" y="764" class="t">memory</text><text x="52" y="786" class="s">Preferences, work notes, settings,</text><text x="52" y="804" class="s">the conversation list; what goes into</text><text x="52" y="822" class="s">the instructions.</text>
<rect x="320" y="738" width="272" height="114" rx="10" class="box"/><text x="336" y="764" class="t">research</text><text x="336" y="786" class="s">Official-source research in an</text><text x="336" y="804" class="s">isolated call; the 23-domain</text><text x="336" y="822" class="s">allowlist.</text>
<rect x="604" y="738" width="272" height="114" rx="10" class="box"/><text x="620" y="764" class="t">voice</text><text x="620" y="786" class="s">The Live session, the bridge to the</text><text x="620" y="804" class="s">same conversation, audio, the key</text><text x="620" y="822" class="s">store, usage.</text>
<rect x="888" y="738" width="272" height="114" rx="10" class="box"/><text x="904" y="764" class="t">changes · clock · basePrompt</text><text x="904" y="786" class="s">What changed, for the UI; the app's</text><text x="904" y="804" class="s">today; the reply format.</text>
<rect x="20" y="884" width="1160" height="132" rx="12" class="band"/><text x="36" y="908" class="h">ENGINE: THE MODEL BEHIND AN INTERFACE</text>
<rect x="36" y="918" width="272" height="84" rx="10" class="core"/><text x="52" y="944" class="t">Engine (types.ts)</text><text x="52" y="966" class="s">The interface: send, steer, stop,</text><text x="52" y="984" class="s">sessions, tools, events.</text>
<rect x="320" y="918" width="272" height="84" rx="10" class="box"/><text x="336" y="944" class="t">FakeEngine</text><text x="336" y="966" class="s">Scripted replies with the real tools,</text><text x="336" y="984" class="s">no model: UI work, demos.</text>
<rect x="604" y="918" width="272" height="84" rx="10" class="box"/><text x="620" y="944" class="t">AppServerEngine</text><text x="620" y="966" class="s">JSON-RPC over stdio (rpc.ts); cuts</text><text x="620" y="984" class="s">leaked notes.</text>
<rect x="888" y="918" width="276" height="84" rx="10" class="ext"/><text x="904" y="944" class="t">codex app-server</text><text x="904" y="966" class="s">codex_home/config.toml, 11 skills,</text><text x="904" y="984" class="s">prompts/.</text>
<path d="M876 960 H884" class="net" marker-end="url(#b)"/>
<path d="M600 148 V176" class="ln" marker-end="url(#a)"/>
<path d="M600 290 V318" class="ln" marker-end="url(#a)"/>
<path d="M600 442 V470" class="ln" marker-end="url(#a)"/>
<path d="M600 558 V586" class="ln" marker-end="url(#a)"/>
<path d="M600 860 V888" class="ln" marker-end="url(#a)"/>
<path d="M984 140 V160 H1172 V304 H740 V344" class="ln" marker-end="url(#a)"/>
<text x="840" y="298" class="lb2">the terminal calls AssistantApp directly</text>
</svg>
