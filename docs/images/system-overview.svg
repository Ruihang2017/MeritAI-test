<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="840" fill="#FFFFFF"/>
<rect x="20" y="20" width="800" height="800" rx="14" fill="#F7F9FC" stroke="#1B1F27" stroke-width="1.6"/><text x="38" y="46" class="h">OWNER'S WINDOWS COMPUTER (ONE WINDOWS USER)</text>
<rect x="40" y="62" width="760" height="418" rx="12" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4" stroke-dasharray="4 3"/><text x="58" y="88" class="h">MERITAI DESKTOP APP (ELECTRON)</text>
<rect x="60" y="100" width="340" height="104" rx="10" class="box"/><text x="76" y="126" class="t">Window: the page (React)</text><text x="76" y="148" class="s">Nine pages, the side panel, voice in the page.</text><text x="76" y="166" class="s">Sandboxed: no Node, no file access. Chinese from</text><text x="76" y="184" class="s">a dictionary on the page.</text>
<rect x="440" y="100" width="340" height="104" rx="10" class="box"/><text x="456" y="126" class="t">Local server</text><text x="456" y="148" class="s">127.0.0.1 only, a random port, a one-time token.</text><text x="456" y="166" class="s">One WebSocket: 83 methods in, events out. Origin</text><text x="456" y="184" class="s">and Host checked.</text>
<rect x="60" y="230" width="340" height="112" rx="10" class="core"/><text x="76" y="256" class="t">AssistantApp (application layer)</text><text x="76" y="278" class="s">What every front end calls: conversations,</text><text x="76" y="296" class="s">forms, confirmations, attachments, screening,</text><text x="76" y="314" class="s">sending email, voice, checks on replies.</text>
<rect x="440" y="230" width="340" height="112" rx="10" class="core"/><text x="456" y="256" class="t">Engine (src/engine)</text><text x="456" y="278" class="s">The Engine interface and its Codex</text><text x="456" y="296" class="s">implementation: JSON-RPC over stdio, streaming,</text><text x="456" y="314" class="s">interrupt, steer, client tools, isolated runs,</text><text x="456" y="332" class="s">resume.</text>
<rect x="60" y="364" width="340" height="100" rx="10" class="box"/><text x="76" y="390" class="t">Core modules and the 34 tools</text><text x="76" y="412" class="s">business · screening · files · email · memory ·</text><text x="76" y="430" class="s">research · voice. The engine calls the tools;</text><text x="76" y="448" class="s">the stores report every change.</text>
<rect x="440" y="364" width="340" height="100" rx="10" class="core"/><text x="456" y="390" class="t">codex app-server (child process)</text><text x="456" y="412" class="s">Runs the conversation with the model. Read-only</text><text x="456" y="430" class="s">sandbox; no shell, plugins, apps or web search;</text><text x="456" y="448" class="s">11 MeritAI skills only.</text>
<path d="M400 152 H436" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M610 204 V216 H230 V226" class="ln" marker-end="url(#a)"/>
<path d="M400 274 H436" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M230 342 V360" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M610 342 V360" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M440 320 H420 V414 H404" class="ln" marker-end="url(#a)"/>
<rect x="40" y="502" width="370" height="160" rx="10" class="store"/><text x="56" y="528" class="t">Workspace folder</text><text x="56" y="546" class="m">%USERPROFILE%\MeritAI</text><text x="56" y="568" class="s">Inbox, Outbox, Jobs, Policies, Feedback. In</text><text x="56" y="586" class="s">.assistant: business.json, register.sqlite,</text><text x="56" y="604" class="s">catalog.sqlite. Plain files; the owner can move the</text><text x="56" y="622" class="s">folder.</text>
<rect x="430" y="502" width="370" height="160" rx="10" class="store"/><text x="446" y="528" class="t">App data folder</text><text x="446" y="546" class="m">%APPDATA%\MeritAI</text><text x="446" y="568" class="s">codex_home: the ChatGPT sign-in and conversations.</text><text x="446" y="586" class="s">memory: settings, preferences, work notes, ratings.</text><text x="446" y="604" class="s">The voice key and the Gmail token are encrypted</text><text x="446" y="622" class="s">(DPAPI).</text>
<path d="M150 464 V498" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M330 464 V488 H520 V498" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M700 464 V498" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="40" y="684" width="240" height="116" rx="10" class="box"/><text x="56" y="710" class="t">Microphone, speaker</text><text x="56" y="732" class="s">Voice only, through the page. No</text><text x="56" y="750" class="s">audio is saved.</text>
<rect x="300" y="684" width="240" height="116" rx="10" class="box"/><text x="316" y="710" class="t">Owner's browser</text><text x="316" y="732" class="s">The ChatGPT and Google sign-in</text><text x="316" y="750" class="s">pages; links in replies.</text>
<rect x="560" y="684" width="240" height="116" rx="10" class="box"/><text x="576" y="710" class="t">Owner's email app</text><text x="576" y="732" class="s">Opens .eml drafts when Gmail</text><text x="576" y="750" class="s">isn't connected.</text>
<text x="860" y="46" class="h">OUTSIDE THE COMPUTER</text>
<rect x="860" y="60" width="320" height="96" rx="10" class="ext"/><text x="876" y="86" class="t">OpenAI: the model</text><text x="876" y="108" class="s">From the Codex engine, signed in with a</text><text x="876" y="126" class="s">ChatGPT account (or an API key).</text>
<rect x="860" y="176" width="320" height="96" rx="10" class="ext"/><text x="876" y="202" class="t">Official Australian websites</text><text x="876" y="224" class="s">Legal research only: OpenAI's web search,</text><text x="876" y="242" class="s">held to 23 allowed domains.</text>
<rect x="860" y="292" width="320" height="96" rx="10" class="ext"/><text x="876" y="318" class="t">OpenAI: Live API (voice)</text><text x="876" y="340" class="s">From AssistantApp, over a WebSocket, with the</text><text x="876" y="358" class="s">owner's own API key.</text>
<rect x="860" y="408" width="320" height="96" rx="10" class="ext"/><text x="876" y="434" class="t">Google: Gmail API</text><text x="876" y="456" class="s">From AssistantApp: sign-in (gmail.send only),</text><text x="876" y="474" class="s">then the emails the owner sends.</text>
<rect x="860" y="524" width="320" height="78" rx="10" class="ext2"/><text x="876" y="550" class="t">GitHub releases</text><text x="876" y="572" class="s">From the desktop shell: update checks, the</text><text x="876" y="590" class="s">installer.</text>
<rect x="860" y="622" width="320" height="78" rx="10" class="ext2"/><text x="876" y="648" class="t">Google Fonts</text><text x="876" y="670" class="s">From the page, when the window opens.</text>
<rect x="860" y="720" width="320" height="80" rx="10" class="ext2"/><text x="876" y="746" class="t">Feedback mailbox</text><text x="876" y="768" class="s">Only an email the tester sends themselves.</text>
<path d="M780 400 H836 V108 H856" class="net" marker-end="url(#b)"/>
<path d="M1020 156 V172" class="dash" marker-end="url(#b)"/>
<path d="M800 340 H856" class="net" marker-end="url(#b)"/>
<path d="M800 456 H856" class="net" marker-end="url(#b)"/>
<path d="M820 563 H856" class="ln" marker-end="url(#a)"/>
<path d="M820 661 H856" class="ln" stroke-dasharray="3 4" marker-end="url(#a)"/>
<path d="M800 760 H856" class="ln" marker-end="url(#a)"/>
</svg>
