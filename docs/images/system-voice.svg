<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
<rect x="20" y="20" width="250" height="520" rx="14" fill="#F7F9FC" stroke="#B8C2D3" stroke-width="1.2"/><text x="38" y="46" class="h">THE PAGE</text>
<rect x="300" y="20" width="560" height="520" rx="14" fill="#FFFFFF" stroke="#1A57CC" stroke-width="1.4" stroke-dasharray="4 3"/><text x="318" y="46" class="h">MERITAI (SERVER AND ASSISTANTAPP)</text>
<text x="890" y="46" class="h">OUTSIDE THE COMPUTER</text>
<rect x="36" y="64" width="218" height="104" rx="10" class="box"/><text x="52" y="90" class="t">Microphone</text><text x="52" y="112" class="s">PCM16, 24 kHz, sent as it is</text><text x="52" y="130" class="s">spoken.</text>
<rect x="36" y="232" width="218" height="104" rx="10" class="box"/><text x="52" y="258" class="t">Speaker</text><text x="52" y="280" class="s">Plays the voice; stops when</text><text x="52" y="298" class="s">the owner speaks.</text>
<rect x="36" y="400" width="218" height="120" rx="10" class="gate"/><text x="52" y="426" class="t">Questions on screen</text><text x="52" y="448" class="s">A change still needs the</text><text x="52" y="466" class="s">owner: press Yes, or say yes.</text><text x="52" y="484" class="s">Deleting needs a press.</text>
<rect x="320" y="64" width="250" height="104" rx="10" class="box"/><text x="336" y="90" class="t">Session</text><text x="336" y="112" class="s">voiceStart, voiceAudio, voiceStop;</text><text x="336" y="130" class="s">audio events only to the page that</text><text x="336" y="148" class="s">started it.</text>
<rect x="590" y="64" width="250" height="104" rx="10" class="core"/><text x="606" y="90" class="t">LiveSession</text><text x="606" y="112" class="s">The WebSocket client. The key</text><text x="606" y="130" class="s">comes from the encrypted store.</text>
<rect x="590" y="232" width="250" height="120" rx="10" class="core"/><text x="606" y="258" class="t">VoiceBridge</text><text x="606" y="280" class="s">Turns a spoken request into a</text><text x="606" y="298" class="s">message in the same conversation:</text><text x="606" y="316" class="s">send, or steer when a reply is</text><text x="606" y="334" class="s">running.</text>
<rect x="320" y="232" width="250" height="120" rx="10" class="box"/><text x="336" y="258" class="t">Limits</text><text x="336" y="280" class="s">Stops after 60 seconds of silence</text><text x="336" y="298" class="s">and at the monthly limit. Seconds</text><text x="336" y="316" class="s">are logged for the usage page.</text>
<rect x="590" y="400" width="250" height="120" rx="10" class="core"/><text x="606" y="426" class="t">Engine</text><text x="606" y="448" class="s">The same Codex conversation as</text><text x="606" y="466" class="s">typing: tools, confirmations,</text><text x="606" y="484" class="s">checks.</text>
<rect x="320" y="400" width="250" height="120" rx="10" class="box"/><text x="336" y="426" class="t">The screen follows</text><text x="336" y="448" class="s">The reply appears as text, with</text><text x="336" y="466" class="s">what changed; the person or job is</text><text x="336" y="484" class="s">marked “Talking about”.</text>
<rect x="890" y="64" width="290" height="136" rx="10" class="ext"/><text x="906" y="90" class="t">OpenAI: Live API</text><text x="906" y="112" class="s">gpt-live-1. Hears, speaks, and answers</text><text x="906" y="130" class="s">small talk itself. Anything else it</text><text x="906" y="148" class="s">hands over as a delegation.</text>
<rect x="890" y="400" width="290" height="120" rx="10" class="ext"/><text x="906" y="426" class="t">OpenAI: the model</text><text x="906" y="448" class="s">Through codex app-server, as for a typed</text><text x="906" y="466" class="s">message.</text>
<path d="M254 104 H316" class="ln" marker-end="url(#a)"/>
<text x="262" y="96" class="lb2">audio</text>
<path d="M570 104 H586" class="ln" marker-end="url(#a)"/>
<path d="M840 96 H886" class="net" marker-end="url(#b)"/>
<text x="843" y="88" class="lbl">audio</text>
<path d="M886 136 H840" class="net" marker-end="url(#b)"/>
<text x="843" y="156" class="lbl">voice</text>
<path d="M590 150 H574" class="ln" marker-end="url(#a)"/>
<path d="M320 150 H292 V284 H258" class="ln" marker-end="url(#a)"/>
<text x="262" y="276" class="lb2">voice</text>
<path d="M1035 200 V214 H715 V228" class="net" marker-end="url(#b)"/>
<text x="730" y="208" class="lbl">delegation: what was asked</text>
<path d="M715 352 V396" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="724" y="378" class="lb2">send or steer; the answer back</text>
<path d="M840 300 H1060 V204" class="net" marker-end="url(#b)"/>
<text x="880" y="292" class="lbl">a short summary to say aloud</text>
<path d="M840 460 H886" class="net" marker-end="url(#b)" marker-start="url(#b)"/>
<path d="M590 460 H574" class="ln" marker-end="url(#a)"/>
<path d="M320 470 H258" class="own" marker-end="url(#c)" marker-start="url(#c)"/>
</svg>
