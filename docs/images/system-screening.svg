<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#FFFFFF"/>
<rect x="20" y="30" width="176" height="150" rx="10" class="store"/><text x="36" y="56" class="t">Job folder</text><text x="36" y="78" class="s">Jobs/&lt;job&gt;: the job</text><text x="36" y="96" class="s">description and the</text><text x="36" y="114" class="s">applications, any file</text><text x="36" y="132" class="s">types, any subfolders.</text>
<rect x="226" y="30" width="176" height="150" rx="10" class="box"/><text x="242" y="56" class="t">1 Ingest</text><text x="242" y="78" class="s">Code. Walks the</text><text x="242" y="96" class="s">folder, hashes, parses</text><text x="242" y="114" class="s">PDF, Word and text</text><text x="242" y="132" class="s">once, finds</text><text x="242" y="150" class="s">duplicates.</text>
<rect x="432" y="30" width="176" height="150" rx="10" class="core"/><text x="448" y="56" class="t">2 Criteria</text><text x="448" y="78" class="s">The model drafts 3 to</text><text x="448" y="96" class="s">8 essential and up to</text><text x="448" y="114" class="s">6 desirable criteria</text><text x="448" y="132" class="s">from the job</text><text x="448" y="150" class="s">description.</text>
<rect x="638" y="30" width="160" height="150" rx="10" class="gate"/><text x="654" y="56" class="t">Owner confirms</text><text x="654" y="78" class="s">On the page or in</text><text x="654" y="96" class="s">the chat. A change</text><text x="654" y="114" class="s">makes a new version.</text>
<rect x="828" y="30" width="176" height="150" rx="10" class="core"/><text x="844" y="56" class="t">3 Evaluate</text><text x="844" y="78" class="s">The model, once per</text><text x="844" y="96" class="s">resume: an isolated</text><text x="844" y="114" class="s">call with no tools,</text><text x="844" y="132" class="s">blind, a fixed result</text><text x="844" y="150" class="s">format.</text>
<rect x="1034" y="30" width="146" height="150" rx="10" class="box"/><text x="1050" y="56" class="t">4 Rank</text><text x="1050" y="78" class="s">Code. Band, then</text><text x="1050" y="96" class="s">essential, then</text><text x="1050" y="114" class="s">desirable score.</text>
<path d="M196 105 H222" class="ln" marker-end="url(#a)"/>
<path d="M402 105 H428" class="ln" marker-end="url(#a)"/>
<path d="M608 105 H634" class="own" marker-end="url(#c)"/>
<path d="M798 105 H824" class="own" marker-end="url(#c)"/>
<path d="M1004 105 H1030" class="ln" marker-end="url(#a)"/>
<rect x="432" y="200" width="572" height="92" rx="10" class="box"/>
<text x="448" y="224" class="t">What “blind” and “isolated” mean</text>
<text x="448" y="246" class="s" style="font-size:12px">Name, email, phone, links and date-of-birth lines are masked. Each resume gets its own</text>
<text x="448" y="263" class="s" style="font-size:12px">short-lived conversation: 20 per run, in parallel, cached by content and criteria</text>
<text x="448" y="280" class="s" style="font-size:12px">version.</text>
<path d="M916 180 V196" class="ln" stroke-dasharray="3 4"/>
<rect x="1034" y="330" width="146" height="150" rx="10" class="box"/><text x="1050" y="356" class="t">5 Results</text><text x="1050" y="378" class="s">On the Hiring page</text><text x="1050" y="396" class="s">and in the chat. A</text><text x="1050" y="414" class="s">Word or Excel</text><text x="1050" y="432" class="s">report only on</text><text x="1050" y="450" class="s">request.</text>
<rect x="828" y="330" width="176" height="150" rx="10" class="gate"/><text x="844" y="356" class="t">6 Owner decides</text><text x="844" y="378" class="s">Shortlist or Not this</text><text x="844" y="396" class="s">time, per candidate.</text><text x="844" y="414" class="s">Kept by file content,</text><text x="844" y="432" class="s">so it survives</text><text x="844" y="450" class="s">re-screening.</text>
<rect x="432" y="330" width="366" height="150" rx="10" class="box"/><text x="448" y="356" class="t">7 Next steps</text><text x="448" y="378" class="s">Interview kit for the shortlist (the adviser).</text><text x="448" y="396" class="s">Candidate emails: drafted by the adviser, reviewed</text><text x="448" y="414" class="s">by the owner, sent from Gmail. Add to Staff: the</text><text x="448" y="432" class="s">form that records the hire.</text>
<rect x="226" y="330" width="176" height="150" rx="10" class="store"/><text x="242" y="356" class="t">Employee register</text><text x="242" y="378" class="s">register.sqlite: work</text><text x="242" y="396" class="s">details only. A hire</text><text x="242" y="414" class="s">links the candidate to</text><text x="242" y="432" class="s">the employee.</text>
<rect x="20" y="330" width="176" height="150" rx="10" class="ext"/><text x="36" y="356" class="t">Gmail</text><text x="36" y="378" class="s">Only the emails the</text><text x="36" y="396" class="s">owner pressed Send on;</text><text x="36" y="414" class="s">test mode sends them</text><text x="36" y="432" class="s">to the owner.</text>
<path d="M1107 180 V326" class="ln" marker-end="url(#a)"/>
<path d="M1034 405 H1008" class="own" marker-end="url(#c)"/>
<path d="M828 405 H802" class="own" marker-end="url(#c)"/>
<path d="M520 330 V310 H314 V326" class="ln" marker-end="url(#a)"/>
<path d="M432 430 H416 V500 H108 V484" class="net" marker-end="url(#b)"/>
<rect x="20" y="524" width="1160" height="106" rx="10" class="store"/>
<text x="36" y="550" class="t">catalog.sqlite (one per workspace, in .assistant)</text>
<rect x="36" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="46" y="585" class="m" style="font-weight:700;fill:#1B1F27">applications</text>
<text x="46" y="604" class="s" style="font-size:11.5px">file, hash, status</text>
<rect x="178" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="188" y="585" class="m" style="font-weight:700;fill:#1B1F27">texts</text>
<text x="188" y="604" class="s" style="font-size:11.5px">parsed text by hash</text>
<rect x="320" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="330" y="585" class="m" style="font-weight:700;fill:#1B1F27">rubrics</text>
<text x="330" y="604" class="s" style="font-size:11.5px">criteria versions</text>
<rect x="462" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="472" y="585" class="m" style="font-weight:700;fill:#1B1F27">evaluations</text>
<text x="472" y="604" class="s" style="font-size:11.5px">result per resume</text>
<rect x="604" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="614" y="585" class="m" style="font-weight:700;fill:#1B1F27">decisions</text>
<text x="614" y="604" class="s" style="font-size:11.5px">the owner's choice</text>
<rect x="746" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="756" y="585" class="m" style="font-weight:700;fill:#1B1F27">job_settings</text>
<text x="756" y="604" class="s" style="font-size:11.5px">people to hire, closed</text>
<rect x="888" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="898" y="585" class="m" style="font-weight:700;fill:#1B1F27">hires</text>
<text x="898" y="604" class="s" style="font-size:11.5px">candidate → employee</text>
<rect x="1030" y="564" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6E9A63" stroke-width="1"/>
<text x="1040" y="585" class="m" style="font-weight:700;fill:#1B1F27">emails</text>
<text x="1040" y="604" class="s" style="font-size:11.5px">drafts and sends</text>
<rect x="20" y="652" width="22" height="16" rx="4" class="core"/>
<text x="50" y="665" class="s">A model call</text>
<rect x="220" y="652" width="22" height="16" rx="4" class="box"/>
<text x="250" y="665" class="s">Code</text>
<rect x="420" y="652" width="22" height="16" rx="4" class="gate"/>
<text x="450" y="665" class="s">The owner decides</text>
<rect x="620" y="652" width="22" height="16" rx="4" class="store"/>
<text x="650" y="665" class="s">Stored on the computer</text>
</svg>
