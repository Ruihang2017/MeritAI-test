<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#FFFFFF"/>
<text x="20" y="40" class="h">THE PATH OF A REQUEST, AND WHERE EACH CONTROL SITS</text>
<rect x="20" y="60" width="160" height="96" rx="10" class="gate"/><text x="36" y="86" class="t">Owner</text><text x="36" y="108" class="s">Types, speaks, drops</text><text x="36" y="126" class="s">files, presses.</text>
<rect x="220" y="60" width="160" height="96" rx="10" class="box"/><text x="236" y="86" class="t">Page</text><text x="236" y="108" class="s">Sandboxed window.</text>
<rect x="420" y="60" width="160" height="96" rx="10" class="box"/><text x="436" y="86" class="t">Local server</text><text x="436" y="108" class="s">Token, allowlist.</text>
<rect x="620" y="60" width="160" height="96" rx="10" class="core"/><text x="636" y="86" class="t">AssistantApp</text><text x="636" y="108" class="s">Flows, forms,</text><text x="636" y="126" class="s">questions.</text>
<rect x="820" y="60" width="160" height="96" rx="10" class="core"/><text x="836" y="86" class="t">Tools</text><text x="836" y="108" class="s">The model's only</text><text x="836" y="126" class="s">hands.</text>
<rect x="1020" y="60" width="160" height="96" rx="10" class="ext"/><text x="1036" y="86" class="t">Model</text><text x="1036" y="108" class="s">Through Codex, at</text><text x="1036" y="126" class="s">OpenAI.</text>
<path d="M184 108 H216" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M384 108 H416" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M584 108 H616" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M784 108 H816" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M984 108 H1016" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<circle cx="266" cy="170" r="11" fill="#1A57CC"/><text x="266" y="174" class="num" text-anchor="middle">1</text>
<circle cx="466" cy="170" r="11" fill="#1A57CC"/><text x="466" y="174" class="num" text-anchor="middle">2</text>
<circle cx="666" cy="170" r="11" fill="#1A57CC"/><text x="666" y="174" class="num" text-anchor="middle">3</text>
<circle cx="866" cy="170" r="11" fill="#1A57CC"/><text x="866" y="174" class="num" text-anchor="middle">4</text>
<circle cx="894" cy="170" r="11" fill="#1A57CC"/><text x="894" y="174" class="num" text-anchor="middle">5</text>
<circle cx="1066" cy="170" r="11" fill="#1A57CC"/><text x="1066" y="174" class="num" text-anchor="middle">6</text>
<circle cx="1094" cy="170" r="11" fill="#1A57CC"/><text x="1094" y="174" class="num" text-anchor="middle">7</text>
<circle cx="694" cy="170" r="11" fill="#1A57CC"/><text x="694" y="174" class="num" text-anchor="middle">8</text>
<circle cx="722" cy="170" r="11" fill="#1A57CC"/><text x="722" y="174" class="num" text-anchor="middle">9</text>
<circle cx="922" cy="170" r="11" fill="#1A57CC"/><text x="922" y="174" class="num" text-anchor="middle">10</text>
<rect x="20" y="206" width="570" height="80" rx="10" class="box"/>
<circle cx="44" cy="232" r="11" fill="#1A57CC"/><text x="44" y="236" class="num" text-anchor="middle">1</text>
<text x="66" y="237" class="t">The window</text>
<text x="36" y="258" class="s" style="font-size:12px">No Node and no file access in the page; links open in the owner's browser; a content</text>
<text x="36" y="275" class="s" style="font-size:12px">security policy.</text>
<rect x="610" y="206" width="570" height="80" rx="10" class="box"/>
<circle cx="634" cy="232" r="11" fill="#1A57CC"/><text x="634" y="236" class="num" text-anchor="middle">2</text>
<text x="656" y="237" class="t">The local server</text>
<text x="626" y="258" class="s" style="font-size:12px">127.0.0.1 only, a random port, a one-time token, Origin and Host checks, 83 named methods</text>
<text x="626" y="275" class="s" style="font-size:12px">with checked inputs.</text>
<rect x="20" y="298" width="570" height="80" rx="10" class="box"/>
<circle cx="44" cy="324" r="11" fill="#1A57CC"/><text x="44" y="328" class="num" text-anchor="middle">3</text>
<text x="66" y="329" class="t">The owner's yes</text>
<text x="36" y="350" class="s" style="font-size:12px">Every change to the profile, the register, hiring records and memory is a question first;</text>
<text x="36" y="367" class="s" style="font-size:12px">stopping withdraws it.</text>
<rect x="610" y="298" width="570" height="80" rx="10" class="box"/>
<circle cx="634" cy="324" r="11" fill="#1A57CC"/><text x="634" y="328" class="num" text-anchor="middle">4</text>
<text x="656" y="329" class="t">Path guards</text>
<text x="626" y="350" class="s" style="font-size:12px">Tools reach only the workspace's Inbox, Outbox, Jobs and Policies: no hidden files, no</text>
<text x="626" y="367" class="s" style="font-size:12px">links out, never .assistant.</text>
<rect x="20" y="390" width="570" height="80" rx="10" class="box"/>
<circle cx="44" cy="416" r="11" fill="#1A57CC"/><text x="44" y="420" class="num" text-anchor="middle">5</text>
<text x="66" y="421" class="t">What isn't stored</text>
<text x="36" y="442" class="s" style="font-size:12px">The register refuses tax file numbers, bank details, dates of birth, addresses, health;</text>
<text x="36" y="459" class="s" style="font-size:12px">memory refuses contact details.</text>
<rect x="610" y="390" width="570" height="80" rx="10" class="box"/>
<circle cx="634" cy="416" r="11" fill="#1A57CC"/><text x="634" y="420" class="num" text-anchor="middle">6</text>
<text x="656" y="421" class="t">The capability allowlist</text>
<text x="626" y="442" class="s" style="font-size:12px">codex_home/config.toml: read-only sandbox, approvals never; no shell, plugins, apps, web</text>
<text x="626" y="459" class="s" style="font-size:12px">search or other agents.</text>
<rect x="20" y="482" width="570" height="80" rx="10" class="box"/>
<circle cx="44" cy="508" r="11" fill="#1A57CC"/><text x="44" y="512" class="num" text-anchor="middle">7</text>
<text x="66" y="513" class="t">Isolation</text>
<text x="36" y="534" class="s" style="font-size:12px">Legal research and each resume run in separate short-lived conversations, so injected text</text>
<text x="36" y="551" class="s" style="font-size:12px">can't reach tools or the web.</text>
<rect x="610" y="482" width="570" height="80" rx="10" class="box"/>
<circle cx="634" cy="508" r="11" fill="#1A57CC"/><text x="634" y="512" class="num" text-anchor="middle">8</text>
<text x="656" y="513" class="t">Checks on replies</text>
<text x="626" y="534" class="s" style="font-size:12px">A link no tool returned is shown unclickable; pay arithmetic and a wrong weekday are</text>
<text x="626" y="551" class="s" style="font-size:12px">flagged; leaked notes are cut.</text>
<rect x="20" y="574" width="570" height="80" rx="10" class="box"/>
<circle cx="44" cy="600" r="11" fill="#1A57CC"/><text x="44" y="604" class="num" text-anchor="middle">9</text>
<text x="66" y="605" class="t">Code decides, the model judges</text>
<text x="36" y="626" class="s" style="font-size:12px">Checklists, reminders, ranking and dates are computed by code; the model writes and</text>
<text x="36" y="643" class="s" style="font-size:12px">explains.</text>
<rect x="610" y="574" width="570" height="80" rx="10" class="box"/>
<circle cx="634" cy="600" r="11" fill="#1A57CC"/><text x="634" y="604" class="num" text-anchor="middle">10</text>
<text x="656" y="605" class="t">Sending</text>
<text x="626" y="626" class="s" style="font-size:12px">The adviser has no sending tool. Email goes only from a button, to an address on screen,</text>
<text x="626" y="643" class="s" style="font-size:12px">with 10 seconds to undo.</text>
</svg>
