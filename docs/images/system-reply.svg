<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1116" viewBox="0 0 1200 1116" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5363"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A57CC"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1B1F27}
      .s{font-size:12.5px;fill:#4A5363}
      .m{font-size:12px;fill:#4A5363;font-family:Consolas,monospace}
      .h{font-size:13px;font-weight:700;letter-spacing:.04em;fill:#5F6878}
      .ttl{font-size:20px;font-weight:700;fill:#1B1F27}
      .box{fill:#FFFFFF;stroke:#B8C2D3;stroke-width:1.2}
      .core{fill:#EEF3FC;stroke:#1A57CC;stroke-width:1.4}
      .store{fill:#F4F8F1;stroke:#6E9A63;stroke-width:1.2}
      .ext{fill:#FFFFFF;stroke:#1A57CC;stroke-width:1.4}
      .ext2{fill:#FFFFFF;stroke:#8A94A6;stroke-width:1.2}
      .gate{fill:#FFF7E0;stroke:#C9971A;stroke-width:1.4}
      .band{fill:#F7F9FC;stroke:#D5DCE8;stroke-width:1}
      .ln{stroke:#4A5363;stroke-width:1.5;fill:none}
      .net{stroke:#1A57CC;stroke-width:1.8;fill:none}
      .dash{stroke:#1A57CC;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .own{stroke:#8A5A00;stroke-width:1.6;fill:none}
      .life{stroke:#B8C2D3;stroke-width:1.2;stroke-dasharray:4 4}
      .lbl,.lb2,.lb3{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
      .lbl{font-size:11.5px;fill:#1446A6;font-weight:600}
      .lb2{font-size:11.5px;fill:#4A5363;font-weight:600}
      .lb3{font-size:11.5px;fill:#6B4E00;font-weight:600}
      .num{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="1116" fill="#FFFFFF"/>
<path d="M90 68 V1100" class="life"/>
<path d="M245 68 V1100" class="life"/>
<path d="M400 68 V1100" class="life"/>
<path d="M560 68 V1100" class="life"/>
<path d="M725 68 V1100" class="life"/>
<path d="M890 68 V1100" class="life"/>
<path d="M1080 68 V1100" class="life"/>
<rect x="18" y="20" width="144" height="48" rx="10" class="gate"/>
<text x="90" y="49" class="t" text-anchor="middle" style="font-size:13.5px">Owner</text>
<rect x="173" y="20" width="144" height="48" rx="10" class="box"/>
<text x="245" y="49" class="t" text-anchor="middle" style="font-size:13.5px">Page</text>
<rect x="328" y="20" width="144" height="48" rx="10" class="box"/>
<text x="400" y="49" class="t" text-anchor="middle" style="font-size:13.5px">Server session</text>
<rect x="488" y="20" width="144" height="48" rx="10" class="core"/>
<text x="560" y="49" class="t" text-anchor="middle" style="font-size:13.5px">AssistantApp</text>
<rect x="653" y="20" width="144" height="48" rx="10" class="core"/>
<text x="725" y="49" class="t" text-anchor="middle" style="font-size:13.5px">Tool and store</text>
<rect x="818" y="20" width="144" height="48" rx="10" class="box"/>
<text x="890" y="49" class="t" text-anchor="middle" style="font-size:13.5px">Engine</text>
<rect x="1008" y="20" width="144" height="48" rx="10" class="ext"/>
<text x="1080" y="40" class="t" text-anchor="middle" style="font-size:13.5px">codex app-server</text>
<text x="1080" y="57" class="t" text-anchor="middle" style="font-size:13.5px">and the model</text>
<path d="M94 104 H241" class="own" marker-end="url(#c)"/>
<text x="100" y="97" class="lb3">“Hannah accepted, she starts Monday”</text>
<path d="M249 144 H396" class="ln" marker-end="url(#a)"/>
<text x="255" y="137" class="lb2">send {text, turnId}</text>
<path d="M404 184 H556" class="ln" marker-end="url(#a)"/>
<text x="410" y="177" class="lb2">app.send(text)</text>
<path d="M564 224 H886" class="ln" marker-end="url(#a)"/>
<text x="570" y="217" class="lb2">engine.send(), with attachments and any memory update</text>
<path d="M894 264 H1076" class="net" marker-end="url(#b)"/>
<text x="900" y="257" class="lbl">turn/start (JSON-RPC over stdio)</text>
<path d="M1076 304 H894" class="net" marker-end="url(#b)"/>
<text x="1070" y="297" class="lbl" text-anchor="end">tool call: add_employee {…}</text>
<path d="M886 344 H729" class="ln" marker-end="url(#a)"/>
<text x="880" y="337" class="lb2" text-anchor="end">tool.handle(args)</text>
<rect x="575" y="362" width="300" height="62" rx="8" class="box"/>
<text x="725" y="379" class="s" text-anchor="middle" style="font-size:12px">Checks first: no tax file number, date of</text>
<text x="725" y="395" class="s" text-anchor="middle" style="font-size:12px">birth, bank or health details; the candidate</text>
<text x="725" y="411" class="s" text-anchor="middle" style="font-size:12px">is found in the job.</text>
<path d="M721 460 H564" class="ln" marker-end="url(#a)"/>
<text x="715" y="453" class="lb2" text-anchor="end">confirm(ConfirmRequest)</text>
<path d="M556 500 H249" class="ln" marker-end="url(#a)"/>
<text x="550" y="493" class="lb2" text-anchor="end">event: confirm {id, what will be saved}</text>
<path d="M94 540 H241" class="own" marker-end="url(#c)"/>
<text x="100" y="533" class="lb3">presses Yes, save (or No)</text>
<path d="M249 580 H556" class="ln" marker-end="url(#a)"/>
<text x="255" y="573" class="lb2">answerConfirm {id, yes}</text>
<path d="M564 620 H721" class="ln" marker-end="url(#a)"/>
<text x="570" y="613" class="lb2">the question resolves: yes</text>
<rect x="575" y="638" width="300" height="46" rx="8" class="store"/>
<text x="725" y="655" class="s" text-anchor="middle" style="font-size:12px">Writes register.sqlite, records the hire in</text>
<text x="725" y="671" class="s" text-anchor="middle" style="font-size:12px">the catalog, and reports the change.</text>
<path d="M721 720 H249" class="ln" marker-end="url(#a)"/>
<text x="715" y="713" class="lb2" text-anchor="end">event: changed {employee added, hired}: pages refresh</text>
<path d="M729 760 H886" class="ln" marker-end="url(#a)"/>
<text x="735" y="753" class="lb2">tool result: text, and a receipt</text>
<path d="M894 800 H1076" class="net" marker-end="url(#b)"/>
<text x="900" y="793" class="lbl">tool output</text>
<path d="M1076 840 H894" class="net" marker-end="url(#b)"/>
<text x="1070" y="833" class="lbl" text-anchor="end">the reply, streamed</text>
<rect x="740" y="858" width="300" height="62" rx="8" class="box"/>
<text x="890" y="875" class="s" text-anchor="middle" style="font-size:12px">On each finished message: planning notes cut</text>
<text x="890" y="891" class="s" text-anchor="middle" style="font-size:12px">from its end, links checked against what the</text>
<text x="890" y="907" class="s" text-anchor="middle" style="font-size:12px">tools returned.</text>
<path d="M886 956 H249" class="ln" marker-end="url(#a)"/>
<text x="880" y="949" class="lb2" text-anchor="end">events: text, tool activity, unverified links, turn end</text>
<rect x="410" y="974" width="300" height="62" rx="8" class="box"/>
<text x="560" y="991" class="s" text-anchor="middle" style="font-size:12px">On the finished reply: a warning if it does</text>
<text x="560" y="1007" class="s" text-anchor="middle" style="font-size:12px">pay arithmetic, or a weekday doesn't match</text>
<text x="560" y="1023" class="s" text-anchor="middle" style="font-size:12px">its date.</text>
<path d="M556 1072 H249" class="ln" marker-end="url(#a)"/>
<text x="550" y="1065" class="lb2" text-anchor="end">events: warning, turnDone</text>
</svg>
